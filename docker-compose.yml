services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: graphsearch
      POSTGRES_PASSWORD: graphsearch
      POSTGRES_DB: graphsearch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphsearch -d graphsearch"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://graphsearch:graphsearch@postgres:5432/graphsearch
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      USE_RQ: "true"
      RQ_QUEUE_NAME: default_docker
      RQ_RUNTIME_MODE: docker
      STORAGE_DIR: /data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - app_storage:/data/storage
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://graphsearch:graphsearch@postgres:5432/graphsearch
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      USE_RQ: "true"
      RQ_QUEUE_NAME: default_docker
      RQ_RUNTIME_MODE: docker
      STORAGE_DIR: /data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - app_storage:/data/storage
    command: python -m app.worker

  reranker:
    build:
      context: ./reranker
    env_file:
      - .env
    profiles:
      - reranker
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - RERANKER_DEVICE=cpu
      - HF_ENDPOINT=https://hf-mirror.com

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  frontend-dev:
    image: node:20-alpine
    profiles:
      - dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  qdrant_data:
  app_storage:
